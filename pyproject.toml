[project]
name = "inventory-harness"
version = "0.1.0"
description = "Harness de razonamiento con herramientas sobre inventarios sinteticos (IIC-3694)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
colab = ["torch", "transformers>=4.51", "accelerate"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inventory_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
